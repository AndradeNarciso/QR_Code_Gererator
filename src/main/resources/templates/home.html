<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>QR Code Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 50px 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            padding: 12px 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            width: 300px;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #007BFF;
            outline: none;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            background: #007BFF;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #0056b3;
        }

        #qrContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #qrImage {
            margin-top: 20px;
            border: 2px solid #007BFF;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        #loading {
            display: none;
            margin-top: 20px;
            color: #007BFF;
            font-weight: bold;
        }

    
        #errorBox {
            display: none;
            margin-top: 20px;
            padding: 15px 20px;
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 6px;
            width: 320px;
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>QR Code Generator</h1>

    <form id="qrForm">
        <input type="text" id="urlInput" placeholder="Input a URL" required>
        <button type="submit">Generate QR Code</button>
    </form>

    <div id="qrContainer">
        <div id="loading">Generating QR Code...</div>
        <img id="qrImage" src="" alt="QR Code" style="display:none;">
        <div id="errorBox"></div>
    </div>

    <script>
        const form = document.getElementById('qrForm');
        const urlInput = document.getElementById('urlInput');
        const qrImage = document.getElementById('qrImage');
        const loading = document.getElementById('loading');
        const errorBox = document.getElementById('errorBox');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = urlInput.value.trim();
            if (!url) return;

            qrImage.style.display = 'none';
            errorBox.style.display = 'none';
            loading.style.display = 'block';

            try {
                const response = await fetch('/api/v1/qrcode/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                if (!response.ok) {
                    const message = await response.text().catch(() => 'Invalid URL, try another one');
                    errorBox.textContent = message;
                    errorBox.style.display = 'block';
                    return;
                }

                const blob = await response.blob();
                const base64 = await blobToBase64(blob);
                qrImage.src = base64;
                qrImage.style.display = 'block';
            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.style.display = 'block';
            } finally {
                loading.style.display = 'none';
            }
        });

        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }
    </script>
</body>

</html>
